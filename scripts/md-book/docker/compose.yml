services:
  handbook:
    build: .
    image: openspec-ddd:mdbook-0.5.4-mermaid-0.17.1
    init: true
    working_dir: ${DOCS_BOOK_ROOT:-/book}
    environment:
      MDBOOK_BUILD__BUILD_DIR: ${MDBOOK_BUILD__BUILD_DIR:?docs.py must set MDBOOK_BUILD__BUILD_DIR}
      PATH: "${DOCS_SVGBOB_BIN:-/usr/local/bin}:/usr/local/bin:/usr/bin:/bin"
    user: "${GUIDE_UID:-1000}:${GUIDE_GID:-1000}"
    volumes:
      - ../../..:/book:ro
      - type: bind
        source: ${DOCS_BOOK_BUILD_HOST:?docs.py must set DOCS_BOOK_BUILD_HOST}
        target: /book/${DOCS_BOOK_BUILD_PATH:?docs.py must set DOCS_BOOK_BUILD_PATH}
    ports:
      - "127.0.0.1:${DOCS_HOST_PORT:-3002}:3002"
