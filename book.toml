[book]
title = "OpenSpec DDD"
description = "Domain-centered contracts, OpenSpec changes, and modular architecture documentation"
language = "en"
src = "docs"

[build]
build-dir = "build/book"
create-missing = false
extra-watch-dirs = ["examples", "templates", "bundle"]

[output.html]
additional-css = ["docs/theme/guide.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
