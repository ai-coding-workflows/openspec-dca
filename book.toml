[book]
title = "OpenSpec DDD"
description = "Domain-centered contracts, OpenSpec changes, and modular architecture documentation"
language = "en"
src = "docs"

[build]
build-dir = "build/book"
create-missing = false
extra-watch-dirs = ["examples", "src"]

[output.html]
additional-css = ["docs/theme/guide.css"]
additional-js = ["docs/theme/mermaid.min.js", "docs/theme/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Optional ASCII-to-SVG diagrams; uncomment to enable Docker-built svgbob.
# [preprocessor.svgbob]
# command = "mdbook-svgbob"
