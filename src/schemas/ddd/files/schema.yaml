    local architecture publication under openspec/specs/** belongs to separately authorized sync/archive
    integration. Descriptive status never exempts a file from the directory-wide boundary.
    Apply may create, edit, remove, or rename explicitly mapped descriptive documentation OUTSIDE
    openspec/specs/**, including component-authorized user pages/handbook sources, navigation, and assets.
    Outside-tree descriptive files retain protected semantic/decision content unchanged; stage necessary
    revisions and report blocked portions. Do not change model meaning, obligations, or decision status
    through prose. Keep one maintained source. Prepare and check local-view proposals inside this change;
    optional outside-tree drafts are planning inputs, not maintained delivery. Before permitted writes,
    reconcile current destinations, preserve unaffected content and pre-existing dirty work, and inspect
    generated/incidental outputs. Dirty files do not authorize broader writes. Snapshot the entire
    protected tree, other protected files, and mapped outside-tree targets before Apply, including new paths.

    A task to write protected artifacts or deploy documentation conflicts with this boundary. Stop
    that work, preserve its intent in tasks.md's non-checkbox Integration handoff, and report it.
    Never create a main spec merely to satisfy catalog validation or documentation links. Resolve
    maintained links to existing durable sources; defer references requiring unpublished protected
    targets to the handoff rather than linking transient change-local drafts. Code, tests, and other
    approved project files remain writable within task scope; no repository-wide permission is implied.

    Work through the tracked Apply checklist in useful slices. For changed executable behavior,
    add/adapt an appropriate test, observe the expected failure where applicable, implement, and
    refactor with tests passing. Reuse adequate tests and explain sequencing exceptions. Check
    real adapter guarantees where relevant, not only fakes. Use useful code-entry-point and
    requirement-to-check links without requiring IDs or a separate manifest. Mark a task done
