    implement an archived change or another active change. The template library is not an
    application baseline. Resolve material semantic/decision blockers before dependent work.

    WRITE BOUNDARY: Planning leaves maintained destinations unchanged.
    The entire openspec/specs/** tree remains read-only during planning and Apply.
    This includes creation, edits, deletion, renaming, and indirect/generated writes, regardless of
    file type: specs, descriptive local architecture, diagrams/assets, models, records, and indexes.
    Maintained model companions, ADR records, and openspec/catalog.json also remain read-only wherever
    located, including supersession annotations. Do not run sync/archive or publish protected content
