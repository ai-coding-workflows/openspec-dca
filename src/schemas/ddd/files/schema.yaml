name: openspec-ddd
version: 2
description: Domain-centered delivery with explicit ports, adapters, executable boundaries, and separate publication
artifacts:
  - id: proposal
    generates: proposal.md
    description: Outcome, scope, acceptance, and owning contexts
    template: proposal.md
    instruction: |
      Read project instructions, openspec/README.md, the selected schema's
      templates/architecture-policy.md, and relevant baseline contracts and decisions.
      Describe one useful outcome, acceptance examples, non-goals, and material risks.
      Identify owning contexts and exact new/modified capability paths relative to
      openspec/specs/. Delivery packages and technical folders are not business owners.
      Reuse accepted boundaries; a new project needs a minimal implementation map and
      executable boundary checks as foundation work, not a complete speculative model.
      Resolve conflicts between a roadmap's implementation suggestions and the adopted
      architecture before dependent work. Name unresolved choices and what they block.
      Keep planning inside this change. All openspec/specs/** content, maintained models,
      ADR records, and the catalog remain read-only through planning and Apply.
      With no changed obligations, explain why and use skip_specs: true only if supported
      by the installed CLI; create no dummy deltas. The model and ADR assessments still
      record reasoned reuse/no-change. Remove the flag when obligations change.
      {{hook:instructions.proposal}}
    requires: []
  - id: impact
    generates: impact.md
    description: Owners, affected boundaries, and consumer dispositions
    template: impact.md
    instruction: |
      Read proposal, prerequisite contracts, models, implementation maps, and decisions.
      Use the optional catalog or a small manual map. Contract consumption, runtime
      calls, source dependencies, and task order are different relationships.
      For each affected use case identify its owning core, driving entry point,
      application boundary, required external capabilities, port owners, and adapters.
      Record create/change/reuse/remove or unresolved, with exact contract references.
      Existing files are not proof of a complete boundary; inspect claimed reuse.
      A port may be a function, protocol, interface, or module API. Features can own
      inbound contracts; do not duplicate them in separate specs for folder symmetry.
      Review direct/transitive consumers, external callers, and system composition.
      Disposition each as contract delta, implementation/docs only, unchanged with
      reason, or unresolved. Match contract-delta owners to actual delta paths in both
      directions; one file satisfying a glob does not prove coverage.
      Identify affected model meanings, views, ADRs, and documentation. Assess scope
      here; keep precise definitions, technical mappings, and ADR rationale in their
      respective artifacts. New owners stay change-local until explicit integration.
      {{hook:instructions.impact}}
    requires: [proposal]
  - id: domain-model
    generates: domain-model-changes.md
    description: Assess and describe changes to owned domain meaning
    template: domain-model-changes.md
    instruction: |
      Read impact, existing models, contracts, and the evidence behind them. Record
      Change required, Reuse existing, or Not affected for each relevant scope, with
      sources and reasons. Missing evidence is unknown, not proof of no model.
      For changed meaning explain concepts, identity, relationships, values/unknowns,
      invariants, and lifecycle where applicable. Distinguish valid historical states
      from permitted new operations, and domain concepts from storage/protocol types.
      Keep one proposed definition here or in a linked change-local model draft, not
      both. Use an example when it resolves ambiguity; do not invent entities or states.
      Normative obligations and scenarios stay in the owning spec deltas. Reconcile
      impact/specs when meaning changes an obligation, including removing skip_specs.
      Map reviewed sources and their revision/basis to proposed drafts and maintained
      destinations. Sources/targets are project-relative; drafts are change-relative.
      Record compatibility concerns and unresolved questions with blocked work.
      Prepare coherent model publication inputs, not edits to maintained models.
      Semantic review must establish understandable meaning, not merely headings.
      {{hook:instructions.domain-model}}
    requires: [impact]
  - id: specs
    generates: "specs/**/spec.md"
    description: Requirement deltas at their exact owning capability paths
    template: spec.md
    instruction: |
      Read impact and the assessed model together with full baseline requirements.
      Write one delta per changed owner at specs/<exact-capability-path>/spec.md.
      Domain owners hold business invariants; features hold use-case outcomes; ports
      hold boundary guarantees; adapters hold meaningful protocol/mapping obligations.
      Identify every needed boundary but create separate specs only for independently
      meaningful contracts. A named function can be a port; a folder is not a contract.
      For changed ports specify input/result meaning, rejection/failure behavior,
      consistency, retries/idempotency, and representation limits where relevant.
      Keep technical mechanisms out of the core contract. Do not weaken a guarantee
      to suit an adapter; resolve the mismatch explicitly. Include representative
      success/rejection/failure cases without turning every scenario into an E2E test.
      Use native ADDED, MODIFIED, REMOVED, and RENAMED Requirements sections as needed.
      Added/modified requirements need exact headings, SHALL/MUST, and at least one
      #### Scenario with WHEN/THEN. MODIFIED carries the full rule and all retained
      scenarios. REMOVED gives Reason/Migration; RENAMED gives FROM/TO. Optional IDs
      do not replace exact-name matching. Add Purpose for new capabilities only;
      metadata/companion edits are separate publication, not requirement deltas.
      With supported skip_specs: true create no delta file. Otherwise validate the
      deltas with the installed CLI. Keep openspec/specs/** unchanged during Apply.
      At authorized sync, these ownership rules also constrain merged requirements;
      native requirement sync does not publish models, views, ADRs, or the catalog.
      {{hook:instructions.specs}}
    requires: [impact, domain-model]
  - id: design
    generates: design.md
    description: Concrete hexagonal realization, delivery slices, and checks
    template: design.md
    instruction: |
      Read baseline plus deltas, impact, model assessment, and existing decisions.
      Enforce the selected architecture policy using language/framework-native
      modules, packages, functions, or interfaces; no prescribed source-folder names.
      For each affected use case map exact proposed/existing paths and symbols for:
      owning core, driving adapter, application entry point, domain rules, outbound
      ports, driven adapters, and composition bindings. Reference adequate existing
      mappings rather than copy them. For no outbound dependency, say why none is needed.
      Show source dependency direction separately from runtime calls. Include type-only
      imports, re-exports, generated dependencies, framework conventions, and any
      cross-context translation. Core code depends on owned contracts, not concrete
      adapters; only composition selects implementations. No hidden global/service
      locator bypass. Resolve unowned boundaries or unapproved violations before work.
      Explain consistency/transaction ownership, failure handling, compatibility,
      migration, and rollback where material. Use one design and useful vertical
      slices. Link significant rationale to the ADR assessment/records; avoid duplication.
      Map affected views to inspected source/basis, action, draft, maintained target,
      and checks. Reuse this implementation map as the publication input when sufficient.
      Planning stays change-local. Apply updates mapped descriptive docs outside
      openspec/specs/**; protected views/models/ADRs remain drafts for integration.
      Plan domain/application tests without framework or real infrastructure, real
      adapter contract/integration checks, a composition smoke check, and executable
      dependency rules. Select levels by affected risk; document genuine non-applicability.
      Architecture checks must detect a deliberately forbidden dependency; cover aliases,
      re-exports, type/compile dependencies and generated paths where the stack uses them.
      On foundation work record runnable local/CI commands, scope, exclusions and their
      reasons. A passing empty scan is not success. Results belong in verification.md.
      {{hook:instructions.design}}
    requires: [specs, impact, domain-model]
  - id: architectural-decisions
    generates: architectural-decisions.md
    description: Reuse, introduce, or supersede significant architectural decisions
    template: architectural-decisions.md
    instruction: |
      Review design/model/spec consistency and existing ADRs. For each significant
      choice record Reuse existing, New ADR, Supersede existing, or No ADR required,
      with reason. A no-change assessment needs no invented record.
      Architecture adoption, context boundaries, consequential dependencies, and scoped
      exceptions warrant review. Routine reversible details can remain in design.
      New/superseding records stay under this change's architectural-decisions/.
      Record context, choice, real alternatives, consequences, validation, destination,
      and actual status/authority. Proposed is not Accepted; acceptance is not publication.
      An exception names the specific dependency, rationale, owner, review/removal trigger,
      and corresponding narrow test allowance. Never disable a whole layer's checks.
      Map record sources, inspected baseline, destinations, and supersession explicitly.
      Check identity collisions at integration. Do not edit maintained records/status
      during Apply. Resolve material open decisions before dependent implementation.
      {{hook:instructions.architectural-decisions}}
    requires: [design, domain-model, specs, impact]
  - id: tasks
    generates: tasks.md
    description: One implementation checklist plus a separate integration handoff
    template: tasks.md
    instruction: |
      Create one numbered Apply checklist of small, useful slices based on the design.
      Each slice names its observable result, owning application boundary, and checks;
      avoid horizontal tasks that build every repository before any working use case.
      Test changed executable behavior first where practical; reuse adequate checks
      and explain exceptions. Include real-adapter failure guarantees where needed.
      Foundation tasks establish the implementation map, test commands, CI boundary
      checks, forbidden-dependency fixtures, and a real composition smoke check.
      Later changes extend these checks when boundaries change; do not exempt new files.
      Include mapped outside-tree documentation delivery and change-local preparation/
      checks of protected models/views/ADRs. Preserve existing dirty work and snapshot
      protected paths before Apply, including additions/deletions and generator output.
      Record actual results in verification.md. A test link or checked task is not proof.
      Keep protected publication in the non-checkbox Integration handoff, referencing
      authoritative model/design/ADR mappings. Prepare integration.json as a closure
      receipt with Pending states; it is evidence, not an eighth planning artifact.
      Separately authorized integration must merge requirements, publish all required
      companions, reconcile links/implementation maps/catalog, and pass closure.py.
      Do not mark a required unfinished publication as a completed or deferred closure.
      Apply completion never authorizes sync/archive, shared-store writes, or deployment.
      {{hook:instructions.tasks}}
    requires: [design, specs, domain-model, architectural-decisions, impact]
apply:
  requires: [proposal, impact, domain-model, specs, design, architectural-decisions, tasks]
  tracks: tasks.md
  instruction: |
    Read the selected active change, project instructions, architecture policy, and
    baseline plus its deltas/model revisions. Resolve blocking semantics/decisions.
    Implement through the mapped application boundary and owned ports, inject concrete
    adapters in composition, and enforce the chosen source dependency rules.
    Work test-first where practical; run focused core tests, affected real-adapter
    checks, architecture checks including their negative controls, and composition
    smoke checks. A green scan covering no real modules is not evidence. Update affected
    tests and mappings when implementation changes; report extra scope before widening it.
    Keep one design/task list and preserve completed history. Mark work done only after
    required checks. Record commands, environment, revisions/content basis, failures,
    Not run results, and limitations in verification.md; never infer a passing result.

    WRITE BOUNDARY: All openspec/specs/** content, maintained models, ADR records/status,
    and openspec/catalog.json remain read-only during planning and Apply, including
    generated writes, additions, removals, and renames. Snapshot and compare protected
    paths and preserve pre-existing dirty work. Do not sync/archive as an Apply substep.
    Apply may update explicitly mapped descriptive docs outside that tree in the local
    development checkout, preserving protected semantics and decision status. Check
    actual maintained targets; optional drafts are not delivery. Stage protected
    revisions inside the change. Never create main specs for links or catalog checks.

    Check model meaning and architecture against implemented behavior, not just headings.
    Prepare the Integration handoff and integration.json with pending publication visible.
    Stop after Apply and report remaining integration. At separately authorized
    integration re-read the current baseline, reconcile overlaps, merge requirement
    deltas, explicitly publish required models/views/ADRs, update dependent durable
    references/implementation maps/catalog, then record fresh snapshots and run closure.py.
    Requirement sync alone does not authorize or perform companion publication.
    Closure requires all three results; no pending protected target may be called current.
    The helper is a read-only evidence check, not a publisher or proof of semantic
    correctness. Project CI/wrappers must invoke it to make failure block closure.
    {{hook:instructions.apply}}
