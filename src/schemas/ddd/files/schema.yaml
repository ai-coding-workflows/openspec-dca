    Apply implements and verifies the selected change, including permitted descriptive documentation.
    Apply updates mapped descriptive documentation outside openspec/specs/** in the development checkout.
    This permission covers repo-local development sources, not a shared canonical store or deployment.
    Read the seven change artifacts (specs may be intentionally skipped), referenced model/ADR
