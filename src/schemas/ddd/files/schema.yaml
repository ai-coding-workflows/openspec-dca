    If implementation exposes a model, requirement, or decision change, revise the responsible
    assessment and downstream artifacts before dependent code. Report additional owners/reasons,
    review consumers without automatically editing them, preserve completed task history, and
    recheck invalidated evidence. Keep one design and one task list. Record actual ADR acceptance
