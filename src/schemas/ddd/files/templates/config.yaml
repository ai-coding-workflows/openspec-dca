schema: openspec-ddd

# Merge starter for the active openspec/config.yaml, not a replacement.
# Preserve project context, rules, operation guidance, permissions, and tool settings.
# Generic artifact instructions live in schema.yaml; no duplicate generic rules list.
context: |
  Write in the established document language for a product-informed reviewer.
  Explain what changes and why before technical detail; define necessary terms.
  Use short overview tables and per-model Before/Proposed sections, keeping exact
  paths in source references. Missing evidence is not an empty or unchanged baseline.
  Separate facts, proposals, recommendations, approval, and open checks. Preserve
  all conditions, risks, identifiers, and evidence; do not simplify guarantees away.
  Start at openspec/README.md and relevant maintained architecture documentation sections.
  Use the selected schema and actual project agent instructions. Its seven artifacts
  are proposal, impact, domain-model, specs, design, architectural-decisions, and tasks.
  The domain-model artifact writes domain-model-changes.md. Both new assessments are
  required even when specs are intentionally skipped; justified no-change outcomes
  do not require inventing a new model or ADR.
  Read baseline contracts with the selected deltas and assessed model revision.
  Keep one outcome, one design, and one tasks.md. Impact identifies scope; the model
  assessment owns proposed meaning; design explains the solution; the decision
  assessment owns ADR dispositions and record mappings. Reference instead of duplicate.
  Real owners use contexts/, technical-capabilities/, or system/ under openspec/specs/.
  In/out is relative to an identified core; cross-context use need not imply shared ownership.
  The template library is openspec/schemas/openspec-ddd/templates/, not a system baseline.
  Individual architectural-decisions/ records are distinct from the change's assessment
  and any maintained shared decision index.
  Planning leaves maintained destinations unchanged; proposed content stays change-local.
  Apply updates mapped descriptive documentation outside openspec/specs/** in the development checkout.
  This includes component-authorized handbook/user pages, navigation, and assets outside
  that tree. Reconcile current targets, preserve unrelated edits, and check actual updates;
  optional drafts alone do not complete this delivery.
  The entire openspec/specs/** tree remains read-only during planning and Apply.
  This includes creation, edits, deletion, renaming, and indirect/generated writes,
  regardless of file type, including local architecture, diagrams, assets, and indexes.
  During Apply, maintained model companions, ADR records, and openspec/catalog.json also
  remain protected wherever located, including status/supersession. Outside-tree mixed-content
  descriptive files retain protected meaning/status unchanged. Prepare and check local-view
  proposals inside the change; local architecture publication under openspec/specs/** belongs
  to separately authorized sync/archive integration, not Apply. Native requirement sync does
  not publish local views or other non-spec documents; companion publication is explicit work.
  Never create a main spec for catalog checks or links. Sync/archive, protected publication,
  shared-store writes, and deployment need separate authorization. tasks.md tracks code,
  outside-tree delivery, and change-local proposal preparation/checks in one checklist, with
  a non-checkbox Integration handoff for remaining separate publication and dependent links.
  Pending protected views stay visible; completed outside-tree docs need no invented promotion.
  Task completion does not imply acceptance, release, or deployment.
  The optional DDD helper is read-only and baseline-only. Catalog entries require actual
  main specs. Keep depends_on and decisions field semantics unchanged.

  {{hook:project.context}}
operations:
  apply:
    guidance:
      - Implement and verify the selected change, including mapped maintained descriptive documentation outside openspec/specs/** and change-local local-architecture proposals; preserve unrelated work and all protected paths.
      - Never invoke sync/archive, protected-artifact promotion, shared-store writes, or documentation deployment inside Apply.
      - Work from both assessments and baseline plus deltas; reconcile semantic or decision discoveries before dependent implementation.
      - Verify mapped outside-tree targets received planned updates and the entire openspec/specs/** tree plus protected model/ADR/catalog files remain unchanged; check change-local proposals and prepare their publication handoff without discarding prior user edits.
      - Record actual evidence and any remaining publication; all tracked tasks done is not acceptance, integration, or archive authorization.
      {{hook:operation.apply}}
  archive:
    guidance:
      - Require separate authorization, actual acceptance, and the applicable checks before closing the change; Apply completion alone is insufficient.
      - At separately authorized sync/archive integration, reconcile deltas and change-local local-view/model/ADR content against the current baseline, explicitly publish mapped protected companions, and confirm maintained documentation is current without overwriting concurrent accepted changes.
      - Before model publication, review whether a product-informed reader can explain the concepts and interpret a concrete example without change history or implementation. Produce a coherent model from reviewed semantics, not a wholesale assessment copy; keep process metadata in assessment/handoff/evidence and check examples against owning requirements. Record actual review, not merely heading presence.
      - Resolve remaining handoff work and dependent links/indexes; register catalog entries only after main specs exist. Native requirement sync merges requirement deltas only, not local architecture or other non-spec documents; authorization for sync alone does not authorize companion publication.
      {{hook:operation.archive}}
